        <ellipse cy="-15" rx="4.5" ry="9" transform="rotate(45)"/>
        <ellipse cy="-15" rx="4.5" ry="9" transform="rotate(90)"/>
        <ellipse cy="-15" rx="4.5" ry="9" transform="rotate(135)"/>
        <ellipse cy="-15" rx="4.5" ry="9" transform="rotate(180)"/>
        <ellipse cy="-15" rx="4.5" ry="9" transform="rotate(225)"/>
        <ellipse cy="-15" rx="4.5" ry="9" transform="rotate(270)"/>
        <ellipse cy="-15" rx="4.5" ry="9" transform="rotate(315)"/>
      </g>
      <circle r="7.5" fill="#51361f"/>
      <circle r="5.5" fill="#704525"/>
    </g>
