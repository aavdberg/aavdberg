      <stop offset="1" stop-color="#368eaa"/>
    </linearGradient>
    <linearGradient id="blend" x2="1">
      <stop stop-color="#f5fbff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#fff5d5" stop-opacity=".45"/>
      <stop offset="1" stop-color="#ffe8a8" stop-opacity="0"/>
    </linearGradient>
