<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">A landscape of the Netherlands and Ukraine</title>
  <desc id="desc">A Dutch windmill and tulips meet Ukrainian sunflower fields and a traditional domed church beneath a shared sky.</desc>
  <defs>
